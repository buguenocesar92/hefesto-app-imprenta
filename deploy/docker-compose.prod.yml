# ---------------------------------------------------------------------------
# Gestion de Imprenta, libreria y papeleria - PRODUCCION
# ---------------------------------------------------------------------------
# Aplicacion propia de Hefesto Studio. NO es un despliegue de una herramienta
# de terceros.
#
# LO UNICO QUE PUBLICA PUERTOS ES EL PROXY
# -----------------------------------------
# En produccion solo `caddy` tiene `ports`. PostgreSQL, Redis, la API y la
# web se hablan por la red interna de Docker y no se ven desde internet.
#
# POR QUE LA API NO SE PUBLICA
#
# El navegador no habla nunca con la API: va a la interfaz, y la interfaz
# reenvia (BFF). Con eso, la API no necesita estar a vista de nadie.
#
# EL ROL DE LA BASE NO PUEDE TENER BYPASSRLS
# ------------------------------------------
# Con `BYPASSRLS` o superusuario, PostgreSQL ignora TODAS las politicas de
# Row Level Security y una imprenta podria ver los pedidos de otra. El
# `entrypoint` de la API corre `imprenta:verificar-aislamiento` y NO levanta
# el servicio si esto falla.
#
# POR ESO HAY DOS ROLES Y NO UNO
# ------------------------------
# `POSTGRES_USER` es el rol de ARRANQUE (`imprenta_admin`). La imagen oficial
# ejecuta `initdb --username="$POSTGRES_USER"` y ese rol NACE superusuario, asi
# que la aplicacion NUNCA conecta con el: con superusuario, PostgreSQL ignora
# las politicas y el `FORCE ROW LEVEL SECURITY` no lo sujeta a el.
#
# El rol de la aplicacion (`DB_USERNAME`, `imprenta_app` por omision) lo crea
# `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
# NOSUPERUSER y NOBYPASSRLS explicitos, y le da la propiedad de la base para que
# las migraciones de Laravel puedan crear el esquema. Ver docs/03.
#
# ANTES DE LEVANTAR
#   1. Copiar .env.example a .env.prod y completarlo con valores reales.
#   2. Definir DB_ADMIN_PASSWORD (el rol de arranque) y DB_PASSWORD (el rol de la
#      aplicacion). Son dos secretos distintos y no se pueden repetir.
#   3. Verificar que el dominio apunta a este servidor (Caddy pide el
#      certificado solo).
#
# Copiar el archivo de entorno FUERA del repositorio, por ejemplo en:
#   /etc/hefesto/imprenta.prod.env
# y apuntar aqui con --env-file.
#
# Ver docs/04-INSTALACION.md y docs/08-RESPALDOS.md.
# ---------------------------------------------------------------------------

name: imprenta

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      # 80 y 443 son del proxy. El 80 solo sirve para redirigir a HTTPS.
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # El certificado tiene que sobrevivir a un reinicio del contenedor.
      - caddy_datos:/data
      - caddy_configuracion:/config
    networks:
      - interna
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    # Sin `ports`: la base no se expone. Solo el proxy publica.
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:?falta DB_DATABASE en el archivo de entorno}
      # Rol de ARRANQUE. La imagen oficial lo crea superusuario. Solo se usa
      # para `initdb` y para lo administrativo: la aplicacion nunca entra con el.
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-imprenta_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el archivo de entorno}
      # Que la base ordene bien en espanol y con la zona de Chile.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Santiago
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque,
      # con NOSUPERUSER y NOBYPASSRLS explicitos. Ver la cabecera.
      APP_DB_ROLE: ${DB_USERNAME:-imprenta_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el archivo de entorno}
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      # El script que crea el rol de la aplicacion. Tiene que existir de verdad:
      # si el archivo no esta, Docker monta un archivo vacio y el rol nunca se
      # crea, y la API falla al conectarse.
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    networks:
      - interna
    healthcheck:
      # `pg_isready` con el rol de la APLICACION: comprueba que la base acepta
      # conexiones del rol que de verdad usa la API, no solo que el proceso vive.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-imprenta_app} -d ${DB_DATABASE:?falta DB_DATABASE en el archivo de entorno}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    # Sin `ports`: la cache no se expone.
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?falta REDIS_PASSWORD en el archivo de entorno}
      --appendonly yes
    volumes:
      - redis_datos:/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    # Sin `ports`. El unico camino desde internet es el proxy -> web -> API.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Gestion de Imprenta"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?falta APP_KEY en el archivo de entorno}
      APP_URL: ${APP_URL:?falta APP_URL en el archivo de entorno}
      APP_WEB_URL: ${APP_WEB_URL:?falta APP_WEB_URL en el archivo de entorno}

      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:?falta DB_DATABASE en el archivo de entorno}
      DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME en el archivo de entorno}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el archivo de entorno}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en el archivo de entorno}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      # En produccion la cookie de sesion solo viaja por HTTPS.
      SESSION_SECURE_COOKIE: "true"
      SESSION_COOKIE: imprenta_sesion

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?falta AUTHENTIK_ISSUER en el archivo de entorno}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?falta AUTHENTIK_CLIENT_ID en el archivo de entorno}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?falta AUTHENTIK_CLIENT_SECRET en el archivo de entorno}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?falta AUTHENTIK_REDIRECT_URI en el archivo de entorno}
      AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email}
      AUTHENTIK_ALGORITMO: ${AUTHENTIK_ALGORITMO:-RS256}
      AUTHENTIK_GRUPO_ADMIN: ${AUTHENTIK_GRUPO_ADMIN:-imprenta-administradores}
      AUTHENTIK_GRUPO_OPERADORES: ${AUTHENTIK_GRUPO_OPERADORES:-imprenta-operadores}

      # --- Reglas de la imprenta ---------------------------------------
      # Sin valor de merma por omision: eso vive en el catalogo de papeles,
      # no aca. Ver api/config/imprenta.php.
      IMPRENTA_TOLERANCIA_PIEZAS: ${IMPRENTA_TOLERANCIA_PIEZAS:-0}
      IMPRENTA_MERMA_AVISO_PUNTOS: ${IMPRENTA_MERMA_AVISO_PUNTOS:-5}
      IMPRENTA_DIAS_PARA_VENCER_PRUEBA: ${IMPRENTA_DIAS_PARA_VENCER_PRUEBA:-5}
      IMPRENTA_DIAS_AVISO_ATRASO: ${IMPRENTA_DIAS_AVISO_ATRASO:-1}
      IMPRENTA_BYTES_MAXIMOS_ARTE: ${IMPRENTA_BYTES_MAXIMOS_ARTE:-52428800}
    volumes:
      - api_uploads:/var/www/html/storage/app/uploads
    networks:
      - interna

  web:
    build:
      context: ../web
      dockerfile: ../deploy/web/Dockerfile
    restart: unless-stopped
    # Sin `ports`. El proxy es quien entra.
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      # Config PRIVADA: el navegador nunca ve la direccion de la API.
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_BASE: ${APP_WEB_URL:?falta APP_WEB_URL en el archivo de entorno}
      NODE_ENV: production
    networks:
      - interna

networks:
  # Red puente comun. El aislamiento de puertos NO viene de aca sino de que
  # solo el proxy declara `ports`: postgres, redis, api y web se hablan por
  # nombre de servicio dentro de esta red y no se ven desde internet.
  #
  # `internal: true` dejaria la API sin salida, y necesita salir para hablar
  # con Authentik. Ponerlo dejaria el acceso roto de una forma dificil de
  # diagnosticar, que es peor que la exposicion que evita.
  interna:
    driver: bridge

volumes:
  postgres_datos:
  redis_datos:
  caddy_datos:
  caddy_configuracion:
  api_uploads:
